# Runs the whole stack anywhere: `docker compose up --build`
# Local development with live reload of the web app:
#   docker compose -f docker-compose.yml -f compose.dev.yml watch
# Secrets (OPENROUTER_API_KEY, INVITE_CODE, APP_URL, Twilio) come from .env via env_file.
# DB wiring is set here so it works inside the compose network.

# Every service: restart after a crash or a Docker/host restart, and cap log
# files (json-file has no limit by default) at 3 x 10 MB.
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *defaults
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: craigslist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      # localhost only: lets host tools (grant-admin, eval) connect without
      # exposing the database to the rest of the network
      - "127.0.0.1:5432:5432"

  # Applies Drizzle migrations (packages/db/migrations) then exits; web waits
  # for it. Safe on the legacy create_all DB — it baselines instead of re-creating.
  migrate:
    <<: *defaults
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: craigslist
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: "no" # one-shot

  web:
    <<: *defaults
    # Next.js app (apps/web). Talks to the db
    # service directly; the Postgres schema is the only contract with the scraper.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner # production standalone build; compose.dev.yml switches to the dev server
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: craigslist
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  # The scraper/classifier/notifier (apps/worker). Plain HTTP, no browser.
  # WORKER_NOTIFY_DRY_RUN=1 records alerts without sending them.
  worker:
    <<: *defaults
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: craigslist
      DB_PORT: 5432
      NOTIFY_DRY_RUN: ${WORKER_NOTIFY_DRY_RUN:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional public tunnel. OFF by default — only starts with:
  #   docker compose --profile tunnel up
  # Drop your tunnel creds + config in ./cloudflared/ (see cloudflared/config.example.yml).
  # Anyone running a copy can ignore this entirely and use localhost:8000.
  cloudflared:
    <<: *defaults
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - web

volumes:
  pgdata:
