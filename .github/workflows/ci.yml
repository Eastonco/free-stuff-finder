name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: craigslist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database (twice — must be idempotent)
        run: pnpm --filter @fsf/db db:migrate && pnpm --filter @fsf/db db:migrate
      - name: Worker integration tests
        env:
          TEST_DB_NAME: workertest
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create database workertest"
          pnpm --filter @fsf/worker test
      - name: Web auth integration tests
        env:
          TEST_DB_NAME: webtest
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create database webtest"
          pnpm --filter @fsf/web test
      - name: Schema has no un-generated changes
        run: |
          pnpm --filter @fsf/db db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain packages/db/migrations)"
